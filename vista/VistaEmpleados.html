<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Empresa - Soluciones Digitales</title>
    <link rel="stylesheet" href="../vista/css/vistaempelados.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- Barra de navegación -->
    <nav>
        <div class="logo">APP/MEDICA</div>
        <div class="nav-links">
            <a href="#" class="active">Inicio</a>
            <a href="#">Citas</a>
            <a href="#">reservas</a>
            <a href="#" class="contact-btn">Medicos</a>
        </div>
    </nav>

   <!-- parte ---------------------2 -->

    <header class="imagen">
        <div class="imagen-content">
            <h1>Medicos disponibles</h1>
            <p>visualisa los medicos segun su especialidad y sus horarios disponibles</p>
            <button class="cta-button">Ver más</button>
        </div>
    </header>

    <!-- Sección de Especialidades -->
    <section class="especialidades">
        <div class="container">
            <h2 class="section-title">Nuestros Especialistas</h2>
            
            <!-- Pestañas de especialidades -->
            <div class="especialidades-tabs">
                <button class="tab-btn active" data-tab="cardiologia">Cardiología</button>
                <button class="tab-btn" data-tab="pediatria">Pediatría</button>
                <button class="tab-btn" data-tab="dermatologia">Dermatología</button>
                <button class="tab-btn" data-tab="ginecologia">Ginecología</button>
                <button class="tab-btn" data-tab="oftalmologia">Oftalmología</button>
                <button class="tab-btn" data-tab="ortopedia">Ortopedia</button>
            </div>
            
            <!-- Contenido de las pestañas -->
            <div class="tab-content">
                <!-- Cardiología -->
                <div class="tab-pane active" id="cardiologia">
                    <h3 class="especialidad-titulo">Cardiólogos</h3>
                    <div class="doctores-grid">
                        <!-- Las tarjetas de médicos se cargarán aquí dinámicamente desde la base de datos -->
                    </div>
                </div>
                
                <!-- Otras especialidades (inicialmente ocultas) -->
                <div class="tab-pane" id="pediatria">
                    <h3 class="especialidad-titulo">Pediatras</h3>
                    <div class="doctores-grid">
                        <!-- Doctores de pediatría aquí -->
                    </div>
                </div>
                
                <div class="tab-pane" id="dermatologia">
                    <h3 class="especialidad-titulo">Dermatólogos</h3>
                    <div class="doctores-grid">
                        <!-- Doctores de dermatología aquí -->
                    </div>
                </div>
                
                <!-- Agregar más especialidades según sea necesario -->
            </div>
        </div>
    </section>

    <!-- Pie de página -->
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>Contacto</h4>
                <p><i class="fas fa-phone"></i> +1 234 567 890</p>
                <p><i class="fas fa-envelope"></i> info@tuempresa.com</p>
            </div>
            <div class="footer-section">
                <h4>Síguenos</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="../vista/js/VISTAEMPLEADOS.JS"></script>
</body>
</html>
